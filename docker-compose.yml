version: '3.8'

services:
  # Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: sports_twin_postgres
    restart: always
    environment:
      POSTGRES_DB: sports_twin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sports_twin"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sports_twin_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/sports_twin
      JWT_SECRET: production_academic_jwt_secret_sports_digital_twin_2026
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      ENVIRONMENT: production
      GEMINI_MODEL: gemini-2.5-flash
      GEMINI_API_KEY: ""
    volumes:
      - backend_uploads:/app/uploads

  # React Web Client
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: sports_twin_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000

volumes:
  postgres_data:
  backend_uploads:
